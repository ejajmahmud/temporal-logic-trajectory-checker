[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-logic-trajectory-checker"
version = "0.1.0"
description = "Linear Temporal Logic trajectory evaluator assessing agent trace logs against safety and liveness properties"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
temporal-logic-trajectory-checker = "temporal_logic_trajectory_checker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["temporal_logic_trajectory_checker*"]
